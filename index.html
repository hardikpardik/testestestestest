<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hackathon Idea Generator, hey vro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ["DM Sans", "ui-sans-serif", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
    <button
      id="theme-toggle"
      type="button"
      class="fixed right-5 top-5 z-20 inline-flex h-11 w-11 items-center justify-center rounded-full border border-slate-200 bg-white text-slate-700 shadow-sm transition hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-violet-400 focus:ring-offset-2 focus:ring-offset-slate-50 dark:border-white/15 dark:bg-white/10 dark:text-slate-100 dark:hover:bg-white/20 dark:focus:ring-cyan-300 dark:focus:ring-offset-slate-950"
      aria-label="Switch to light mode"
      aria-pressed="true"
    >
      <svg
        id="icon-moon"
        class="hidden h-5 w-5 dark:block"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="1.8"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M21 14.25A8.25 8.25 0 1 1 9.75 3 6.75 6.75 0 0 0 21 14.25Z"
        />
      </svg>
      <svg
        id="icon-sun"
        class="h-5 w-5 dark:hidden"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="1.8"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 3.75v1.5m0 13.5v1.5m8.25-8.25h-1.5m-13.5 0H3.75m12.99-5.24-1.06 1.06M8.32 15.68l-1.06 1.06m10.48 0-1.06-1.06M8.32 8.32 7.26 7.26M16.5 12a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0Z"
        />
      </svg>
    </button>

    <div class="pointer-events-none fixed inset-0 overflow-hidden">
      <div class="absolute -left-24 -top-24 h-72 w-72 rounded-full bg-violet-500/20 blur-3xl"></div>
      <div class="absolute -right-16 top-40 h-80 w-80 rounded-full bg-cyan-400/10 blur-3xl"></div>
    </div>

    <main class="relative mx-auto flex min-h-screen max-w-2xl flex-col justify-center px-6 py-16">
      <header class="mb-10 text-center">
        <p class="mb-3 text-xs font-semibold uppercase tracking-[0.2em] text-violet-600 dark:text-cyan-300">
          Weekend spark
        </p>
        <h1 class="text-4xl font-bold tracking-tight text-slate-900 dark:text-white sm:text-5xl">
          Hackathon Idea Generator
        </h1>
        <p class="mt-4 text-base text-slate-600 dark:text-slate-400">
          Click the button for a random project you could ship in 24–48 hours.
        </p>
      </header>

      <section
        class="rounded-3xl border border-slate-200 bg-white p-8 shadow-xl shadow-slate-200/70 backdrop-blur dark:border-white/10 dark:bg-white/5 dark:shadow-2xl dark:shadow-violet-950/40"
      >
        <p class="mb-2 text-sm font-medium text-slate-500 dark:text-slate-400">Your idea</p>
        <p
          id="idea"
          class="min-h-[6.5rem] text-xl font-semibold leading-relaxed text-slate-900 dark:text-white"
          aria-live="polite"
        >
          Ready when you are.
        </p>
        <button
          id="generate-btn"
          type="button"
          class="mt-8 w-full rounded-2xl bg-gradient-to-r from-violet-500 to-cyan-400 px-6 py-3.5 text-base font-semibold text-slate-950 transition hover:brightness-110 focus:outline-none focus:ring-2 focus:ring-violet-400 focus:ring-offset-2 focus:ring-offset-slate-50 dark:focus:ring-cyan-300 dark:focus:ring-offset-slate-950"
        >
          Generate idea
        </button>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
